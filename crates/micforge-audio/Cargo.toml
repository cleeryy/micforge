[package]
name = "micforge-audio"
version = "0.1.0"
edition = "2021"
description = "MicForge audio I/O: cpal capture at 48 kHz mono through the core DSP chain"

[dependencies]
micforge-core = { path = "../micforge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
anyhow = "1"
