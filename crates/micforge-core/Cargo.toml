[package]
name = "micforge-core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust DSP chain for MicForge — zero OS dependencies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Future real neural suppressor (e.g. nnnoiseless/RNNoise port).
# Off by default; NoiseSuppress block is currently a pass-through stub.
nnnoiseless = []
