[package]
name = "micforge"
version = "0.1.0"
edition = "2021"
description = "MicForge desktop app (Tauri v2): any-mic real-time DSP router"

[lib]
name = "micforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
micforge-core = { path = "../crates/micforge-core" }
micforge-audio = { path = "../crates/micforge-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
